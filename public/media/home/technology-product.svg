<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- Technology & Product Marketing placeholder: a product window linked to a network of capability nodes -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B2B"/>
      <stop offset="0.6" stop-color="#0F2A2A"/>
      <stop offset="1" stop-color="#004B3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#C5A059" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#C5A059" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4DC9A"/>
      <stop offset="0.5" stop-color="#C5A059"/>
      <stop offset="1" stop-color="#9A7330"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#F8F6F0" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- Connections from the product to the four capability nodes -->
  <g fill="none" stroke="#C5A059" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 10">
    <path d="M430 330 C330 300 260 250 200 200"/>
    <path d="M430 560 C330 600 260 660 200 700"/>
    <path d="M870 330 C960 290 1010 240 1040 190"/>
    <path d="M870 560 C960 610 1010 660 1040 710"/>
  </g>

  <!-- Product window -->
  <g>
    <rect x="410" y="250" width="480" height="360" rx="22" fill="#0B1B2B" fill-opacity="0.85" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M410 300H890" stroke="#F8F6F0" stroke-opacity="0.12" stroke-width="2"/>
    <circle cx="442" cy="275" r="7" fill="#C5A059"/>
    <circle cx="466" cy="275" r="7" fill="#8BA898" fill-opacity="0.7"/>
    <circle cx="490" cy="275" r="7" fill="#F8F6F0" fill-opacity="0.25"/>
    <!-- Headline and copy lines -->
    <rect x="450" y="335" width="250" height="18" rx="9" fill="#F8F6F0" fill-opacity="0.85"/>
    <rect x="450" y="368" width="190" height="12" rx="6" fill="#F8F6F0" fill-opacity="0.3"/>
    <rect x="450" y="392" width="220" height="12" rx="6" fill="#F8F6F0" fill-opacity="0.3"/>
    <rect x="450" y="432" width="120" height="34" rx="17" fill="url(#gold)"/>
    <!-- Rising value chart -->
    <path d="M720 560 L765 520 L800 535 L850 470" fill="none" stroke="#C5A059" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M828 468 H852 V492" fill="none" stroke="#C5A059" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#8BA898">
      <circle cx="720" cy="560" r="7"/>
      <circle cx="765" cy="520" r="7"/>
      <circle cx="800" cy="535" r="7"/>
    </g>
    <rect x="450" y="500" width="70" height="70" rx="12" fill="#F8F6F0" fill-opacity="0.06" stroke="#F8F6F0" stroke-opacity="0.12"/>
    <rect x="535" y="500" width="70" height="70" rx="12" fill="#F8F6F0" fill-opacity="0.06" stroke="#F8F6F0" stroke-opacity="0.12"/>
    <rect x="620" y="500" width="70" height="70" rx="12" fill="#C5A059" fill-opacity="0.16" stroke="#C5A059" stroke-opacity="0.5"/>
  </g>

  <!-- Capability nodes: cloud, AI, security, enterprise -->
  <g fill="#0B1B2B" stroke="#C5A059" stroke-width="2.5">
    <circle cx="180" cy="185" r="62"/>
    <circle cx="180" cy="715" r="62"/>
    <circle cx="1050" cy="175" r="62"/>
    <circle cx="1050" cy="725" r="62"/>
  </g>
  <g fill="none" stroke="#F4DC9A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cloud -->
    <path d="M160 205a17 17 0 0 1-2-34 22 22 0 0 1 42-4 18 18 0 0 1-1 38Z"/>
    <!-- AI chip -->
    <rect x="1030" y="155" width="40" height="40" rx="6"/>
    <rect x="1042" y="167" width="16" height="16" rx="2"/>
    <path d="M1040 147v8M1060 147v8M1040 195v8M1060 195v8M1022 165h8M1022 185h8M1070 165h8M1070 185h8"/>
    <!-- Shield -->
    <path d="M180 685l-26 11v20c0 16 11 30 26 36 15-6 26-20 26-36v-20Z"/>
    <path d="m169 718 8 8 15-15"/>
    <!-- Building -->
    <path d="M1030 750v-52a6 6 0 0 1 6-6h22a6 6 0 0 1 6 6v52M1064 718h10a6 6 0 0 1 6 6v26M1024 750h62M1041 704h12M1041 718h12M1041 732h12"/>
  </g>

  <!-- Accent dots -->
  <g fill="#C5A059">
    <circle cx="610" cy="140" r="5"/>
    <circle cx="640" cy="760" r="4" fill-opacity="0.6"/>
    <circle cx="330" cy="450" r="4" fill-opacity="0.6"/>
    <circle cx="960" cy="450" r="5"/>
  </g>
</svg>
